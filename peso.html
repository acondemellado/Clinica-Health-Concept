  renderVals() {

    const fx = (n) => String(Math.round(n * 10) / 10);
    const es = (n, d) => n.toFixed(d).replace('.', ',');
    const R = (s) => { let x = s; return () => (x = x * 16807 % 2147483647) / 2147483647; };
    const nz = (r) => (r() + r() + r() + r() - 2) / 0.58;
    const ease = (t, k) => 1 - Math.pow(1 - t, k);

    const gen = (n, a, b, amp, seed, k) => { const r = R(seed); return Array.from({ length: n }, (_, i) => a + (b - a) * ease(i / (n - 1), k) + nz(r) * amp); };
    const avg = (a) => { const b = a.filter((v) => v != null); return b.length ? b.reduce((s, v) => s + v, 0) / b.length : null; };
    const wk = (a) => { const o = []; for (let i = 0; i < a.length; i += 7) o.push(avg(a.slice(i, i + 7))); return o; };
    const mo = (a) => { const o = []; for (let m = 0; m < 6; m++) { const s = a.slice(Math.round(m * 30.4), Math.round((m + 1) * 30.4)); if (s.length) o.push(avg(s)); } return o; };
    const sx = (n, L, Rr) => (i) => L + (i + 0.5) * (Rr - L) / n;
    const sy = (min, max, T, B) => (v) => B - (clamp(v, min, max) - min) / (max - min) * (B - T);
    const line = (vals, X, Y) => { let d = '', pen = false; vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + fx(X(i)) + ',' + fx(Y(v)); pen = true; }); return d; };

    const bars = (vals, X, Y, base, w, r) => vals.map((v, i) => (v == null ? '' : rbar(X(i) - w / 2, Y(v), w, base, r))).join('');
    const circ = (cx, cy, r) => 'M' + fx(cx - r) + ',' + fx(cy) + 'a' + r + ',' + r + ' 0 1,0 ' + 2 * r + ',0a' + r + ',' + r + ' 0 1,0 ' + -2 * r + ',0';
    const dots = (vals, X, Y, r) => vals.map((v, i) => (v == null ? '' : circ(X(i), Y(v), r))).join('');
    const ring = (pct, r) => { const C = 2 * Math.PI * r; return fx(C * clamp(pct, 0, 1)) + ' ' + fx(C); };
    const chip = (good) => (good ? ['#E3F4EC', '#0B6B4F'] : ['#FDEFE0', '#8A4B00']);
    const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    const START = Date.UTC(2026, 4, 11);
    const dlabel = (d) => { const t = new Date(START + d * 864e5); return t.getUTCDate() + ' ' + MES[t.getUTCMonth()]; };
    const sparkOf = (full, W) => { const v = full.filter((x) => x != null); const mn = Math.min(...v), mx = Math.max(...v); const pad = (mx - mn) * 0.12 + 1e-6; const X = sx(full.length, 0, 120), Y = sy(mn - pad, mx + pad, 3, 33); const vis = full.slice(0, W); return { spark: line(vis, X, Y), area: area(vis, X, Y, 36) }; };
    const kpi = (label, value, unit, color, delta, good, full, W) => { const c = chip(good); const s = sparkOf(full, W); return { label, value, unit, color, delta, bg: c[0], fg: c[1], spark: s.spark, area: s.area }; };
    const sgn = (v, d) => { const r = Math.round(v * Math.pow(10, d)) / Math.pow(10, d); return (r > 0 ? '+' : r < 0 ? '−' : '±') + es(Math.abs(r), d); };
    const st = this.state || {};
    const stage = st.stage || 'm6';
    const agg = st.agg || 'sem';
    const STAGES = [['s2', 'Semana 2', 2], ['m1', 'Mes 1', 4], ['m3', 'Mes 3', 13], ['m6', 'Mes 6', 26]];
    const W = STAGES.find((s) => s[0] === stage)[2];
    const D = W * 7;
    const MV = Math.max(1, Math.round(W / 4.33));
    const stages = STAGES.map((s) => ({ label: s[1], on: s[0] === stage, off: s[0] !== stage, pick: () => this.setState({ stage: s[0], agg }) }));
    const aggs = [['sem', 'Semanal'], ['mes', 'Mensual']].map((a) => ({ label: a[1], on: a[0] === agg, off: a[0] !== agg, pick: () => this.setState({ stage, agg: a[0] }) }));
    const common = { stages, aggs, week: W, dateLabel: dlabel(D - 1), isSem: agg === 'sem', isMes: agg === 'mes' };

    const N = 182;
    const rw = R(101);
    const wt = Array.from({ length: N }, (_, i) => 104.2 - 11.8 * ease(i / (N - 1), 1.45) + nz(rw) * 0.32 + ((i % 7) >= 5 ? 0.35 : 0));
    const isp = gen(N, 53, 80, 6.5, 71, 1.8).map((v) => clamp(v, 20, 98));
    const meals = [['Desayuno', 6.3, 7.8], ['Comida', 6.6, 8.0], ['Cena', 4.6, 7.3], ['Snacks', 5.4, 7.4]];
    const gsd = meals.map((m, k) => gen(N, m[1], m[2], 1.05, 131 + k * 7, 1.7).map((v) => clamp(v, 1, 10)));
    const rs = R(151);
    const logged = Array.from({ length: N * 4 }, () => rs() > 0.07);
    const met = gen(N, 49, 76, 3.4, 171, 1.7).map((v) => clamp(v, 0, 100));
    const bas = gen(N, 113, 95, 3.6, 181, 1.9);
    const last7 = (a) => avg(a.slice(Math.max(0, D - 7), D));
    const first7 = (a) => avg(a.slice(0, 7));

    // hero
    const X26 = sx(26, 44, 852), YH = sy(86, 106, 14, 272);
    const XD = (i) => 44 + (i + 0.5) * (852 - 44) / N;
    const wW = wk(wt).slice(0, W);
    const up = [], lo = [];
    for (let w = 0; w < 26; w++) { up.push(104.2 * (1 - 0.005 * w)); lo.push(104.2 * (1 - 0.01 * w)); }
    const cone = 'M' + up.map((v, w) => fx(X26(w)) + ',' + fx(YH(v))).join('L') + 'L' + lo.slice().reverse().map((v, j) => fx(X26(25 - j)) + ',' + fx(YH(v))).join('L') + 'Z';
    const wNow = last7(wt);
    const prevW = wW.length > 4 ? wW[wW.length - 5] : wW[0];
    const rate = wW.length > 1 ? (wW[wW.length - 1] - prevW) / Math.min(4, wW.length - 1) : -0.6;
    const lastV = wW[wW.length - 1];
    let proj = '';
    let etaW = null;
    if (rate < 0) {
      const wks = (lastV - 90) / -rate;
      etaW = W - 1 + wks;
      const endW = Math.min(25, etaW), endV = lastV + rate * (endW - (W - 1));
      if (endW > W - 1) proj = 'M' + fx(X26(W - 1)) + ',' + fx(YH(lastV)) + 'L' + fx(X26(endW)) + ',' + fx(YH(Math.max(90, endV)));
    }
    const X6 = sx(6, 44, 852);
    const mW = mo(wt.slice(0, D)).slice(0, MV);
    const mt = {};
    for (let i = 0; i < 6; i++) { mt['v' + i] = i < mW.length ? es(mW[i], 1) : ''; mt['y' + i] = i < mW.length ? fx(YH(mW[i]) - 8) : 0; }

    // goal
    const lost = 104.2 - wNow;
    const gp = clamp(lost / 14.2, 0, 1);
    const reach = (target) => { const i = wk(wt).findIndex((v, k) => k < W && v <= target); return i; };
    const r5 = reach(99.0), r10 = reach(93.8);
    const etaTxt = etaW == null ? 'calculando ritmo' : etaW <= 25 ? 'previsto hacia la semana ' + Math.ceil(etaW + 1) : 'previsto en ' + dlabel(Math.round((etaW + 1) * 7));
    const miles = [
      { label: '−5 % · 99,0 kg', sub: r5 >= 0 ? 'Conseguido en la semana ' + (r5 + 1) : 'Pendiente', icon: r5 >= 0 ? '✓' : '1', bg: r5 >= 0 ? '#0E9F77' : '#B8BCC8' },
      { label: '−10 % · 93,8 kg', sub: r10 >= 0 ? 'Conseguido en la semana ' + (r10 + 1) : 'Pendiente', icon: r10 >= 0 ? '✓' : '2', bg: r10 >= 0 ? '#0E9F77' : '#B8BCC8' },
      { label: 'Objetivo · 90 kg', sub: etaTxt, icon: '3', bg: '#1F8FB5' },
    ];

    // waist
    const WAW = [0, 4, 8, 13, 17, 21, 25], WAV = [112, 109.6, 107.4, 105.3, 103.6, 102.1, 100.8];
    const nWa = WAW.filter((w) => w < W).length;
    const wxs = (w) => 12 + w / 25 * 376, wys = sy(98, 114, 12, 104);
    const waVis = WAV.slice(0, nWa);

    // isp
    const XI = sx(26, 36, 512), YI = sy(30, 90, 12, 186);
    const wI = wk(isp).slice(0, W);
    const pickI = (f) => wI.map((v) => (f(v) ? v : null));
    const ispNow = last7(isp), ispSt = first7(isp);

    // glucoscore heatmap
    const d0 = Math.max(0, D - 28);
    const gcells = [];
    for (let k = 0; k < 4; k++) for (let j = 0; j < 28; j++) {
      const day = d0 + j;
      if (day >= D) { gcells.push({ bg: 'transparent', bd: '1px dashed #D3D5DD', t: '' }); continue; }
      if (!logged[day * 4 + k]) { gcells.push({ bg: '#E3E5EA', bd: '0', t: dlabel(day) + ' · sin registro' }); continue; }
      const v = gsd[k][day];
      gcells.push({ bg: v >= 7 ? '#2FA36B' : v >= 5 ? '#F2C14E' : '#E0533D', bd: '0', t: dlabel(day) + ' · ' + meals[k][0] + ' ' + es(v, 1) });
    }
    const mealAvg = meals.map((m, k) => avg(gsd[k].slice(d0, D)));
    const worst = mealAvg.indexOf(Math.min(...mealAvg));
    const mealsOut = meals.map((m, k) => ({ name: m[0], v: es(mealAvg[k], 1), bg: k === worst ? '#FDF0DC' : '#F6F7F9' }));
    const gsNow = avg(gsd.map((a) => avg(a.slice(Math.max(0, D - 7), D))));
    const gsSt = avg(gsd.map((a) => avg(a.slice(0, 7))));

    // inflammation / oxidative
    const CTRL = 20;
    const hasCtrl = W > CTRL;
    const NA = hasCtrl ? 3 : 2;
    const IN = [61, 68, 41].slice(0, NA), OX = [64, 71, 48].slice(0, NA);
    const zx = (v) => clamp(v, 0, 100) * 3;
    const zp = (a) => 'M' + a.map((v) => fx(zx(v)) + ',24').join('L');
    const zh = (a) => circ(zx(a[0]), 24, 5);
    const zd = (a) => a.map((v, i) => (i === 0 ? '' : circ(zx(v), 24, i === a.length - 1 ? 8 : 5))).join('');
    const lvl = (v) => (v < 33 ? 'Bajo' : v < 66 ? 'Moderado' : 'Alto');
    const inNow = IN[NA - 1], oxNow = OX[NA - 1];
    const COMP = [['PCR ultrasensible', [4.9, 6.1, 2.6], 'mg/L', 1], ['Ratio neutrófilos/linfocitos', [2.6, 2.9, 2.0], '', 1], ['VSG', [20, 24, 12], 'mm/h', 0], ['Ferritina', [290, 320, 205], 'ng/mL', 0]];
    const inComp = COMP.map(([name, v, u, d]) => ({ name, u, a: es(v[hasCtrl ? 1 : 0], d), b: es(v[NA - 1], d) }));
    const ic = chip(hasCtrl && inNow < 68), oc = chip(hasCtrl && oxNow < 71);

    // metab & basal
    const XM = sx(26, 40, 622), YM = sy(40, 90, 12, 186), YG = sy(85, 120, 12, 186);
    const wM = wk(met).slice(0, W), wB = wk(bas).slice(0, W);
    const HV = [4.4, 5.1, 2.6];
    const homa = HV.slice(0, NA).map((h, i) => ({ when: ['jun 25', 'may 26', 'sep 26'][i], v: es(h, 1), bg: h < 2.5 ? '#E3F4EC' : h < 3.5 ? '#FDF0DC' : '#FBE3E0', fg: h < 2.5 ? '#0B6B4F' : h < 3.5 ? '#8A4B00' : '#9A2A1E' }));

    const recs = [
      { name: 'Merluza al horno con verduras asadas y quinoa', isp: 86, gs: '8,4', kcal: 520, why: 'Alta en proteína y fibra; sustituye a tu cena con pan blanco.' },
      { name: 'Crema de calabaza con garbanzos tostados', isp: 82, gs: '8,1', kcal: 430, why: 'La legumbre suaviza el pico frente a la pasta de los martes.' },
      { name: 'Tortilla de espinacas con ensalada de tomate y aguacate', isp: 80, gs: '8,6', kcal: 470, why: 'Muy baja carga glucémica para los días sin entreno.' },
    ];

    const wkPct = wk(wt).map((v) => (104.2 - v) / 104.2 * 100);
    const kpis = [
      kpi('Peso', es(wNow, 1), 'kg', '#1F8FB5', sgn(wNow - 104.2, 1) + ' kg desde el inicio', true, wk(wt), W),
      kpi('Peso perdido', es(lost / 104.2 * 100, 1), '%', '#146C8A', lost / 104.2 >= 0.05 ? 'Objetivo clínico −5 % superado' : 'Hacia el −5 % clínico', lost / 104.2 >= 0.05, wkPct, W),
      kpi('Cintura', es(waVis[waVis.length - 1], 1), 'cm', '#0F766E', sgn(waVis[waVis.length - 1] - 112, 1) + ' cm desde el inicio', true, [112, 111, 110.2, 109.6, 109, 108.3, 107.8, 107.4, 107, 106.4, 106, 105.6, 105.3, 105, 104.6, 104.2, 103.9, 103.6, 103.2, 102.8, 102.4, 102.1, 101.7, 101.4, 101.1, 100.8], W),
      kpi('ISP medio', Math.round(ispNow), '%', '#2FA36B', sgn(ispNow - ispSt, 0) + ' pts desde el inicio', ispNow >= ispSt, wk(isp), W),
      kpi('Glucoscore medio', es(gsNow, 1), '/10', '#E0A21B', sgn(gsNow - gsSt, 1) + ' desde el inicio', gsNow >= gsSt, wk(gsd[2].map((v, i) => (v + gsd[0][i] + gsd[1][i] + gsd[3][i]) / 4)), W),
      kpi('Inflamación interna', inNow, '/100', '#B4467A', hasCtrl ? sgn(inNow - 68, 0) + ' desde la analítica inicial' : 'Alta · control en la semana 21', inNow < 66, Array.from({ length: 26 }, (_, w) => (w > CTRL ? 41 : 68)), W),
    ];
    const isc = chip(ispNow >= 75);
    return Object.assign(common, {
      kpis,
      wNow: es(wNow, 1), wLost: es(lost, 1) + ' kg', wRate: (rate < 0 ? '−' : '+') + es(Math.abs(rate), 2) + ' kg/sem',
      cone, wDots: wt.slice(0, D).map((v, i) => circ(XD(i), YH(v), 2.4)).join(''), wLine: line(wW, X26, YH),
      wLast: circ(X26(wW.length - 1), YH(lastV), 7), proj,
      moBars: bars(mW.map((v) => v), X6, YH, 272, 84, 10), mt,
      gRing: ring(gp, 46), gPct: Math.round(gp * 100), miles,
      waNow: es(waVis[waVis.length - 1], 1), waDelta: sgn(waVis[waVis.length - 1] - 112, 1) + ' cm',
      waLine: waVis.length > 1 ? 'M' + waVis.map((v, i) => fx(wxs(WAW[i])) + ',' + fx(wys(v))).join('L') : '',
      waDots: waVis.map((v, i) => circ(wxs(WAW[i]), wys(v), 5)).join(''),
      iLow: bars(pickI((v) => v < 60), XI, YI, 186, 12, 4), iMid: bars(pickI((v) => v >= 60 && v <= 75), XI, YI, 186, 12, 4), iHigh: bars(pickI((v) => v > 75), XI, YI, 186, 12, 4),
      ispChip: Math.round(ispNow) + ' % esta semana', ispBg: isc[0], ispFg: isc[1],
      ispText: wI.filter((v) => v >= 75).length + ' de ' + W + ' semanas por encima del objetivo. Mejor semana: ' + Math.round(Math.max(...wI)) + ' %.',
      gcells, gFrom: dlabel(d0), gTo: dlabel(Math.min(D, d0 + 28) - 1), meals: mealsOut,
      inNow, inLvl: lvl(inNow), inDelta: hasCtrl ? sgn(inNow - 68, 0) + ' desde may' : sgn(68 - 61, 0) + ' frente a 2025', inBg: ic[0], inFg: ic[1], inPath: zp(IN), inHist: zh(IN), inDots: zd(IN), inComp,
      oxNow, oxLvl: lvl(oxNow), oxDelta: hasCtrl ? sgn(oxNow - 71, 0) + ' desde may' : sgn(71 - 64, 0) + ' frente a 2025', oxBg: oc[0], oxFg: oc[1], oxPath: zp(OX), oxHist: zh(OX), oxDots: zd(OX),
      oxText: hasCtrl ? 'En 4,5 meses ha bajado ' + (71 - oxNow) + ' puntos, después de un año subiendo. Coincide con más verdura, menos ultraprocesados y mejor descanso.' : 'Punto de partida alto y en aumento desde la analítica de 2025. Lo revisaremos en el control de la semana 21 (finales de septiembre).',
      recs,
      metNow: Math.round(last7(met)), metSt: Math.round(first7(met)), mLine: line(wM, XM, YM), mArea: area(wM, XM, YM, 186),
      homa, bLine: line(wB, XM, YG), bDots: dots(wB, XM, YG, 3.5),
    });

  }
}
</script>

<script>
(function () {
  class DCLogic {
    constructor(props) { this.props = props; this.state = {}; }
    setState(patch) { this.state = Object.assign({}, this.state, patch); render(); }
    forceUpdate() { render(); }
  }
  const sc = document.getElementById('dc-logic');
  const meta = JSON.parse(sc.getAttribute('data-props') || '{}');
  const props = {};
  for (const k in meta) if (k[0] !== '$' && meta[k] && 'default' in meta[k]) props[k] = meta[k].default;
  const Component = new Function('DCLogic', sc.textContent + '; return Component;')(DCLogic);
  const comp = new Component(props);
  const TEMPLATE = document.getElementById('dc-template').innerHTML;
  const root = document.getElementById('dc-root');
  const look = (p, s) => { p = p.trim(); if (p === 'true') return true; if (p === 'false') return false; return p.split('.').reduce((o, k) => (o == null ? undefined : o[k]), s); };
  const sub = (str, s) => str.replace(/\{\{\s*([\w.$]+)\s*\}\}/g, (_, p) => { const v = look(p, s); return v == null ? '' : String(v); });
  const whole = (str, s) => { const m = /^\s*\{\{\s*([\w.$]+)\s*\}\}\s*$/.exec(str || ''); return m ? look(m[1], s) : undefined; };
  function walk(node, s) {
    for (const ch of Array.from(node.childNodes)) {
      if (ch.nodeType === 3) { if (ch.nodeValue.includes('{{')) ch.nodeValue = sub(ch.nodeValue, s); continue; }
      if (ch.nodeType !== 1) continue;
      const tag = ch.tagName.toLowerCase();
      if (tag === 'sc-for') {
        const list = whole(ch.getAttribute('list'), s) || [];
        const as = ch.getAttribute('as');
        const frag = document.createDocumentFragment();
        list.forEach((item, i) => {
          const box = document.createElement('div');
          for (const c of Array.from(ch.childNodes)) box.appendChild(c.cloneNode(true));
          walk(box, Object.assign({}, s, { [as]: item, $index: i }));
          while (box.firstChild) frag.appendChild(box.firstChild);
        });
        ch.replaceWith(frag); continue;
      }
      if (tag === 'sc-if') {
        if (whole(ch.getAttribute('value'), s)) { walk(ch, s); ch.replaceWith(...Array.from(ch.childNodes)); } else ch.remove();
        continue;
      }
      for (const a of Array.from(ch.attributes)) {
        const m = /^on([a-z]+)$/i.exec(a.name);
        if (m) { const fn = whole(a.value, s); ch.removeAttribute(a.name); if (typeof fn === 'function') ch.addEventListener(m[1].toLowerCase(), fn); continue; }
        if (a.value.includes('{{')) ch.setAttribute(a.name, sub(a.value, s));
      }
      walk(ch, s);
    }
  }
  function render() {
    const vals = comp.renderVals();
    const y = window.scrollY;
    const tpl = document.createElement('template');
    tpl.innerHTML = TEMPLATE;
    const frag = tpl.content;
    const box = document.createElement('div');
    box.appendChild(frag);
    walk(box, vals);
    root.replaceChildren(...Array.from(box.childNodes));
    window.scrollTo(0, y);
  }
  render();
})();
</script>
