<script type="text/plain" id="dc-logic" data-props='{"$preview":{"width":1440,"height":2790}}'>
class Component extends DCLogic {
  renderVals() {

    const fx = (n) => String(Math.round(n * 10) / 10);
    const es = (n, d) => n.toFixed(d).replace('.', ',');
    const R = (s) => { let x = s; return () => (x = x * 16807 % 2147483647) / 2147483647; };
    const nz = (r) => (r() + r() + r() + r() - 2) / 0.58;
    const ease = (t, k) => 1 - Math.pow(1 - t, k);
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const gen = (n, a, b, amp, seed, k) => { const r = R(seed); return Array.from({ length: n }, (_, i) => a + (b - a) * ease(i / (n - 1), k) + nz(r) * amp); };
    const avg = (a) => { const b = a.filter((v) => v != null); return b.length ? b.reduce((s, v) => s + v, 0) / b.length : null; };
    const wk = (a) => { const o = []; for (let i = 0; i < a.length; i += 7) o.push(avg(a.slice(i, i + 7))); return o; };
    const mo = (a) => { const o = []; for (let m = 0; m < 6; m++) { const s = a.slice(Math.round(m * 30.4), Math.round((m + 1) * 30.4)); if (s.length) o.push(avg(s)); } return o; };
    const sx = (n, L, Rr) => (i) => L + (i + 0.5) * (Rr - L) / n;
    const sy = (min, max, T, B) => (v) => B - (clamp(v, min, max) - min) / (max - min) * (B - T);
    const line = (vals, X, Y) => { let d = '', pen = false; vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + fx(X(i)) + ',' + fx(Y(v)); pen = true; }); return d; };
    const area = (vals, X, Y, base) => { const p = []; vals.forEach((v, i) => { if (v != null) p.push([X(i), Y(v)]); }); if (p.length < 2) return ''; return 'M' + p.map((q) => fx(q[0]) + ',' + fx(q[1])).join('L') + 'L' + fx(p[p.length - 1][0]) + ',' + base + 'L' + fx(p[0][0]) + ',' + base + 'Z'; };
    const rbar = (x, y, w, b, r) => { const h = b - y; if (h <= 0.5) return ''; r = Math.min(r, w / 2, h); return 'M' + fx(x) + ',' + fx(b) + 'V' + fx(y + r) + 'Q' + fx(x) + ',' + fx(y) + ' ' + fx(x + r) + ',' + fx(y) + 'H' + fx(x + w - r) + 'Q' + fx(x + w) + ',' + fx(y) + ' ' + fx(x + w) + ',' + fx(y + r) + 'V' + fx(b) + 'Z'; };
    const bars = (vals, X, Y, base, w, r) => vals.map((v, i) => (v == null ? '' : rbar(X(i) - w / 2, Y(v), w, base, r))).join('');
    const circ = (cx, cy, r) => 'M' + fx(cx - r) + ',' + fx(cy) + 'a' + r + ',' + r + ' 0 1,0 ' + 2 * r + ',0a' + r + ',' + r + ' 0 1,0 ' + -2 * r + ',0';
    const dots = (vals, X, Y, r) => vals.map((v, i) => (v == null ? '' : circ(X(i), Y(v), r))).join('');
    const ring = (pct, r) => { const C = 2 * Math.PI * r; return fx(C * clamp(pct, 0, 1)) + ' ' + fx(C); };
    const chip = (good) => (good ? ['#E3F4EC', '#0B6B4F'] : ['#FDEFE0', '#8A4B00']);
    const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    const START = Date.UTC(2026, 4, 11);
    const dlabel = (d) => { const t = new Date(START + d * 864e5); return t.getUTCDate() + ' ' + MES[t.getUTCMonth()]; };
    const sparkOf = (full, W) => { const v = full.filter((x) => x != null); const mn = Math.min(...v), mx = Math.max(...v); const pad = (mx - mn) * 0.12 + 1e-6; const X = sx(full.length, 0, 120), Y = sy(mn - pad, mx + pad, 3, 33); const vis = full.slice(0, W); return { spark: line(vis, X, Y), area: area(vis, X, Y, 36) }; };
    const kpi = (label, value, unit, color, delta, good, full, W) => { const c = chip(good); const s = sparkOf(full, W); return { label, value, unit, color, delta, bg: c[0], fg: c[1], spark: s.spark, area: s.area }; };
    const sgn = (v, d) => { const r = Math.round(v * Math.pow(10, d)) / Math.pow(10, d); return (r > 0 ? '+' : r < 0 ? '−' : '±') + es(Math.abs(r), d); };
    const st = this.state || {};

    const agg = st.agg || 'sem';
    const STAGES = [['s2', 'Semana 2', 2], ['m1', 'Mes 1', 4], ['m3', 'Mes 3', 13], ['m6', 'Mes 6', 26]];
    const W = STAGES.find((s) => s[0] === stage)[2];
    const D = W * 7;
    const MV = Math.max(1, Math.round(W / 4.33));
    const stages = STAGES.map((s) => ({ label: s[1], on: s[0] === stage, off: s[0] !== stage, pick: () => this.setState({ stage: s[0], agg }) }));
    const aggs = [['sem', 'Semanal'], ['mes', 'Mensual']].map((a) => ({ label: a[1], on: a[0] === agg, off: a[0] !== agg, pick: () => this.setState({ stage, agg: a[0] }) }));
    const common = { stages, aggs, week: W, dateLabel: dlabel(D - 1), isSem: agg === 'sem', isMes: agg === 'mes' };

    const N = 182;
    const gap = (i) => i >= 63 && i <= 76;
    const met = gen(N, 58, 81, 3.2, 11, 1.8).map((v) => clamp(v, 0, 100));
    const bas = gen(N, 104.5, 91, 3.4, 23, 2).map((v, i) => (gap(i) ? null : v));
    const magN = gen(N, 17.4, 10.6, 1.7, 37, 2).map((v, i) => (gap(i) ? null : v));
    const magD = gen(N, 31.5, 22, 2.4, 41, 2).map((v, i) => (gap(i) ? null : v));
    const rdy = gen(N, 57, 75, 8, 53, 1.6).map((v) => clamp(v, 25, 98));
    const rh = R(67);
    const hypo = Array.from({ length: N }, (_, i) => (gap(i) ? null : rh() < 0.14 - 0.12 * ease(i / (N - 1), 1.6) ? 1 : 0));

    // hero
    const X26 = sx(26, 44, 852), YH = sy(40, 90, 14, 272);
    const wM = wk(met).slice(0, W);
    const marks = [0, 5, 16].filter((w) => w < W).map((w) => 'M' + fx(X26(w)) + ',14V272').join('');
    const X6 = sx(6, 44, 852);
    const mM = mo(met.slice(0, D)).slice(0, MV);
    const mt = {};
    for (let i = 0; i < 6; i++) { mt['v' + i] = i < mM.length ? Math.round(mM[i]) : ''; mt['y' + i] = i < mM.length ? fx(YH(mM[i]) - 8) : 0; }
    const last7 = (a) => avg(a.slice(Math.max(0, D - 7), D));
    const first7 = (a) => avg(a.slice(0, 7));
    const metNow = last7(met), metSt = first7(met);

    // analyses: 3 before the programme (2024-2025), initial (week 0) and control (week 16, ~4 months)
    const CTRL = 16;
    const hasCtrl = W > CTRL;
    const NA = hasCtrl ? 5 : 4;
    const DIFF = [1.6, 2.3, 2.9, 3.1, -0.7].slice(0, NA);
    const PHENO = [51.3, 55.1];
    const bioNow = hasCtrl ? PHENO[0] : PHENO[1];
    const bd = DIFF[NA - 1];
    const BX = [40, 120, 200, 280, 360];
    const bh = (v) => Math.abs(v) * 11;
    const vbar = (x, v) => (v >= 0 ? rbar(x - 18, 70 - bh(v), 36, 70, 6) : 'M' + fx(x - 18) + ',70H' + fx(x + 18) + 'V' + fx(70 + bh(v)) + 'H' + fx(x - 18) + 'Z');
    const bioHist = DIFF.slice(0, 3).map((v, i) => vbar(BX[i], v)).join('');
    const bioPos = DIFF.map((v, i) => (i >= 3 && v >= 0 ? vbar(BX[i], v) : '')).join('');
    const bioNeg = DIFF.map((v, i) => (i >= 3 && v < 0 ? vbar(BX[i], v) : '')).join('');
    const bl = {};
    for (let i = 0; i < 5; i++) { const v = DIFF[i]; bl['v' + i] = v == null ? '' : sgn(v, 1); bl['y' + i] = v == null ? 0 : v >= 0 ? fx(70 - bh(v) - 6) : fx(70 + bh(v) + 14); }

    // readiness today
    const rdNow = Math.round(rdy[D - 1]);
    const r7 = rdy.slice(Math.max(0, D - 7), D);
    const X7 = sx(7, 0, 400), Y7 = sy(0, 100, 4, 56);
    const rd7 = bars(r7.map((v, i) => (i < r7.length - 1 ? v : null)), X7, Y7, 56, 34, 6);
    const rd7last = bars(r7.map((v, i) => (i === r7.length - 1 ? v : null)), X7, Y7, 56, 34, 6);
    const rdTitle = rdNow >= 75 ? 'Buen día para entrenar fuerte' : rdNow >= 55 ? 'Día para actividad moderada' : 'Prioriza descanso y paseo suave';
    const rdText = rdNow >= 75 ? 'Tu noche fue estable y la VFC está por encima de tu media.' : rdNow >= 55 ? 'Recuperación correcta. Mantén el plan sin añadir intensidad.' : 'La noche fue poco reparadora. Mueve el entreno intenso a otro día.';

    // stability
    const Xs = sx(26, 40, 622);
    const yN = sy(6, 22, 10, 104), yD = sy(14, 38, 10, 104);
    const wN = wk(magN).slice(0, W), wD = wk(magD).slice(0, W);
    const nNow = avg(magN.slice(Math.max(0, D - 14), D));
    const stabGood = nNow != null && nNow < 12;

    // basal
    const yB = sy(80, 116, 12, 206);
    const XB = (i) => 40 + (i + 0.5) * (622 - 40) / N;
    const bVis = bas.slice(0, D);
    const roll = bVis.map((v, i) => avg(bVis.slice(Math.max(0, i - 6), i + 1)));
    const bNow = last7(bas) || avg(bas.slice(0, D).filter((v) => v != null).slice(-7));
    const bSt = first7(bas);
    const daysIn = bVis.filter((v) => v != null && v < 100).length, daysT = bVis.filter((v) => v != null).length;

    // calendar
    const cells = Array.from({ length: N }, (_, i) => {
      const t = dlabel(i);
      if (i >= D) return { bg: 'transparent', bd: '1px dashed #D3D5DD', t };
      if (hypo[i] == null) return { bg: '#DADCE3', bd: '0', t: t + ' · sin sensor' };
      return hypo[i] ? { bg: '#D9423A', bd: '0', t: t + ' · hipoglucemia' } : { bg: '#BFE6D6', bd: '0', t };
    });
    const cnt = (a, b) => hypo.slice(a, b).filter((v) => v === 1).length;
    let streak = 0; for (let i = D - 1; i >= 0 && hypo[i] !== 1; i--) streak++;

    // readiness weekly
    const XR = sx(26, 36, 512), YR = sy(30, 90, 10, 186);
    const wR = wk(rdy).slice(0, W);
    const pick = (f) => wR.map((v) => (f(v) ? v : null));

    // biomarkers: [mar 24, feb 25, oct 25 | may 26 (inicio), sep 26 (control)]
    const BM = [
      ['HbA1c', '%', [5.6, 5.7, 5.8, 5.9, 5.5], 4.8, 6.4, 4.8, 5.6, '< 5,7 %', 1],
      ['Glucosa en ayunas', 'mg/dL', [96, 99, 103, 106, 93], 80, 115, 70, 99, '70–99 mg/dL', 0],
      ['Insulina basal', 'µU/mL', [9.5, 11.2, 12.8, 14.2, 8.6], 4, 18, 2, 10, '2–10 µU/mL', 1],
      ['HOMA-IR', '', [2.3, 2.7, 3.3, 3.7, 2.0], 1, 4.5, 0, 2, '< 2', 1],
      ['Triglicéridos / HDL', '', [2.4, 2.7, 2.9, 3.1, 1.9], 1, 3.6, 0, 2, '< 2', 1],
      ['Colesterol LDL', 'mg/dL', [132, 139, 144, 148, 126], 100, 160, 0, 116, '< 116 mg/dL', 0],
      ['PCR ultrasensible', 'mg/L', [1.8, 2.4, 2.9, 3.4, 1.5], 0, 4, 0, 1, '< 1 mg/L', 1],
      ['Vitamina D', 'ng/mL', [26, 24, 22, 21, 35], 15, 45, 30, 60, '30–60 ng/mL', 0],
    ];
    const bmx = [2, 13, 21, 28, 32].map((m) => 12 + m / 35 * 216);
    const bms = BM.map(([name, unit, vals, mn, mx, lo, hi, ref, dec]) => {
      const vis = vals.slice(0, NA);
      const y = sy(mn, mx, 6, 58);
      const now = vis[vis.length - 1];
      const inR = now >= lo && now <= hi;
      const near = !inR && (now < lo ? (lo - now) / (lo || 1) < 0.25 : (now - hi) / hi < 0.25);
      const s = inR ? ['En rango', '#E3F4EC', '#0B6B4F'] : near ? ['Vigilar', '#FDF0DC', '#8A4B00'] : ['Fuera de rango', '#FBE3E0', '#9A2A1E'];
      const by0 = y(Math.min(hi, mx)), by1 = y(Math.max(lo, mn));
      return {
        name, unit, ref, status: s[0], bg: s[1], fg: s[2],
        value: es(now, dec), change: hasCtrl ? sgn(now - vals[3], dec) + ' desde el inicio' : sgn(now - vals[0], dec) + ' desde 2024',
        bandY: fx(by0), bandH: fx(Math.max(0, by1 - by0)),
        line: 'M' + vis.map((v, i) => fx(bmx[i]) + ',' + fx(y(v))).join('L'),
        hdots: vis.slice(0, 3).map((v, i) => circ(bmx[i], y(v), 4)).join(''),
        dots: vis.map((v, i) => (i >= 3 ? circ(bmx[i], y(v), 5) : '')).join(''),
      };
    });

    // KPIs
    const wB = wk(bas), wHy = wk(hypo.map((v) => (v == null ? null : v))).map((v) => (v == null ? null : v * 7));
    const hNow = cnt(Math.max(0, D - 30), D), hSt = cnt(0, Math.min(30, D));
    const kpis = [
      kpi('Salud metabólica', Math.round(metNow), '/100', '#0E9F77', sgn(metNow - metSt, 0) + ' pts desde el inicio', metNow >= metSt, wk(met), W),
      kpi('Glucemia basal', Math.round(bNow), 'mg/dL', '#D9423A', sgn(bNow - bSt, 0) + ' mg/dL desde el inicio', bNow <= bSt, wB, W),
      kpi('Estabilidad nocturna', nNow == null ? '—' : es(nNow, 1), 'MAG', '#4B4FD1', nNow == null ? 'sin sensor' : nNow < 12 ? 'Estable' : nNow <= 17 ? 'Aceptable' : 'Comprometida', stabGood, wk(magN), W),
      kpi('Noches con hipoglucemia', hNow, 'en ' + Math.min(30, D) + ' días', '#C2410C', W < 5 ? 'primer mes en curso' : sgn(hNow - hSt, 0) + ' frente al primer mes', hNow <= hSt, wHy, W),
      kpi('Readiness', Math.round(last7(rdy)), '%', '#F07A2B', sgn(last7(rdy) - first7(rdy), 0) + ' pts desde el inicio', last7(rdy) >= first7(rdy), wk(rdy), W),
      kpi('Edad biológica', es(bioNow, 1), 'años', '#0F766E', sgn(bd, 1) + ' frente a tu edad real', bd <= 0, Array.from({ length: 26 }, (_, w) => (w > CTRL ? 51.3 : 55.1)), W),
    ];

    const sc = chip(stabGood), bc = chip(bNow <= 99), bioC = chip(bd <= 0);
    return Object.assign(common, {
      kpis,
      metNow: Math.round(metNow), metStart: Math.round(metSt), metDelta: sgn(metNow - metSt, 0),
      metOpt: met.slice(0, D).filter((v) => v >= 70).length + ' de ' + D,
      mLine: line(wM, X26, YH), mArea: area(wM, X26, YH, 272), mDots: dots(wM.slice(0, -1), X26, YH, 3.5),
      mLast: wM.length ? circ(X26(wM.length - 1), YH(wM[wM.length - 1]), 7) : '',
      marks, mk1: 1, mk2: W > 5 ? 1 : 0, mk3: W > 16 ? 1 : 0,
      moBars: bars(mM, X6, YH, 272, 84, 10), mt,
      bioNow: es(bioNow, 1), bioDelta: sgn(bd, 1) + ' años vs real', bioBg: bioC[0], bioFg: bioC[1], bioHist, bioPos, bioNeg, bl,
      bioText: hasCtrl ? 'En 4 meses has pasado de 3,1 años por encima de tu edad real a 0,7 por debajo. La diferencia llevaba creciendo desde 2024.' : 'Al empezar, tu edad biológica estaba 3,1 años por encima de la real y la diferencia crecía desde 2024. Analítica de control en la semana 17 (septiembre).',
      rdNow, rdRing: ring(rdNow / 100, 46), rd7, rd7last, rdTitle, rdText,
      nLine: line(wN, Xs, yN), nDots: dots(wN, Xs, yN, 3.5), dLine: line(wD, Xs, yD), dDots: dots(wD, Xs, yD, 3.5),
      stabChip: nNow == null ? 'Sin sensor' : nNow < 12 ? 'Noches estables' : nNow <= 17 ? 'Noches aceptables' : 'Noches comprometidas', stabBg: sc[0], stabFg: sc[1],
      bDots: bVis.map((v, i) => (v == null ? '' : circ(XB(i), yB(v), 2.6))).join(''), bLine: line(roll, XB, yB),
      basalChip: Math.round(bNow) + ' mg/dL', basalBg: bc[0], basalFg: bc[1],
      basalText: daysIn + ' de ' + daysT + ' días con sensor dentro del rango objetivo.',
      cells, hFirst: hSt, hLast: hNow, hStreak: streak,
      rwLow: bars(pick((v) => v < 50), XR, YR, 186, 12, 4), rwMid: bars(pick((v) => v >= 50 && v <= 70), XR, YR, 186, 12, 4), rwHigh: bars(pick((v) => v > 70), XR, YR, 186, 12, 4),
      rwText: wR.filter((v) => v > 70).length + ' de ' + W + ' semanas con readiness medio por encima de 70.',
      bms,
    });

  }
}
</script>

<script>
(function () {
  class DCLogic {
    constructor(props) { this.props = props; this.state = {}; }
    setState(patch) { this.state = Object.assign({}, this.state, patch); render(); }
    forceUpdate() { render(); }
  }
  const sc = document.getElementById('dc-logic');
  const meta = JSON.parse(sc.getAttribute('data-props') || '{}');
  const props = {};
  for (const k in meta) if (k[0] !== '$' && meta[k] && 'default' in meta[k]) props[k] = meta[k].default;
  const Component = new Function('DCLogic', sc.textContent + '; return Component;')(DCLogic);
  const comp = new Component(props);
  const TEMPLATE = document.getElementById('dc-template').innerHTML;
  const root = document.getElementById('dc-root');
  const look = (p, s) => { p = p.trim(); if (p === 'true') return true; if (p === 'false') return false; return p.split('.').reduce((o, k) => (o == null ? undefined : o[k]), s); };
  const sub = (str, s) => str.replace(/\{\{\s*([\w.$]+)\s*\}\}/g, (_, p) => { const v = look(p, s); return v == null ? '' : String(v); });
  const whole = (str, s) => { const m = /^\s*\{\{\s*([\w.$]+)\s*\}\}\s*$/.exec(str || ''); return m ? look(m[1], s) : undefined; };
  function walk(node, s) {
    for (const ch of Array.from(node.childNodes)) {
      if (ch.nodeType === 3) { if (ch.nodeValue.includes('{{')) ch.nodeValue = sub(ch.nodeValue, s); continue; }
      if (ch.nodeType !== 1) continue;
      const tag = ch.tagName.toLowerCase();
      if (tag === 'sc-for') {
        const list = whole(ch.getAttribute('list'), s) || [];
        const as = ch.getAttribute('as');
        const frag = document.createDocumentFragment();
        list.forEach((item, i) => {
          const box = document.createElement('div');
          for (const c of Array.from(ch.childNodes)) box.appendChild(c.cloneNode(true));
          walk(box, Object.assign({}, s, { [as]: item, $index: i }));
          while (box.firstChild) frag.appendChild(box.firstChild);
        });
        ch.replaceWith(frag); continue;
      }
      if (tag === 'sc-if') {
        if (whole(ch.getAttribute('value'), s)) { walk(ch, s); ch.replaceWith(...Array.from(ch.childNodes)); } else ch.remove();
        continue;
      }
      for (const a of Array.from(ch.attributes)) {
        const m = /^on([a-z]+)$/i.exec(a.name);
        if (m) { const fn = whole(a.value, s); ch.removeAttribute(a.name); if (typeof fn === 'function') ch.addEventListener(m[1].toLowerCase(), fn); continue; }
        if (a.value.includes('{{')) ch.setAttribute(a.name, sub(a.value, s));
      }
      walk(ch, s);
    }
  }
  function render() {
    const vals = comp.renderVals();
    const y = window.scrollY;
    const tpl = document.createElement('template');
    tpl.innerHTML = TEMPLATE;
    const frag = tpl.content;
    const box = document.createElement('div');
    box.appendChild(frag);
    walk(box, vals);
    root.replaceChildren(...Array.from(box.childNodes));
    window.scrollTo(0, y);
  }
  render();
})();
</script>
